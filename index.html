<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Prototype</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100dvh;
    display: flex;
    justify-content: center;
    background: #e8e8ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* the widget — edge to edge on mobile, capped column on desktop */
  .app {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    background: #fff;
    overflow: hidden;
  }
  @media (min-width: 460px) {
    .app { box-shadow: 0 0 0 1px rgba(0,0,0,.07), 0 12px 40px rgba(0,0,0,.10); }
  }

  /* bench controls — inert for now */
  .bench-bar {
    display: flex;
    gap: 8px;
    padding: 8px 10px;
    background: #f7f7f8;
    border-bottom: 1px solid #e5e5e7;
  }
  .bench-bar select {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 11px;
    color: #3a3a3c;
    background: #fff;
    border: 1px solid #d6d6d8;
    border-radius: 7px;
    padding: 5px 6px;
  }

  /* chat area */
  #chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.35;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user {
    align-self: flex-end;
    background: #0b84ff;
    color: #fff;
    border-bottom-right-radius: 5px;
  }
  .bot {
    align-self: flex-start;
    background: #ececed;
    color: #111;
    border-bottom-left-radius: 5px;
  }
  .note {
    display: block;
    margin-top: 5px;
    font-size: 11px;
    color: #777;
    font-variant-numeric: tabular-nums;
  }

  /* composer */
  .composer {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid #e5e5e7;
    background: #fff;
  }
  #input {
    flex: 1;
    min-width: 0;
    border: 1px solid #d6d6d8;
    border-radius: 20px;
    padding: 10px 14px;
    font-size: 16px;
    outline: none;
    font-family: inherit;
  }
  #input:focus { border-color: #0b84ff; }
  #send {
    flex-shrink: 0;
    border: 0;
    background: #0b84ff;
    color: #fff;
    border-radius: 20px;
    padding: 0 18px;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="app">
  <div class="bench-bar">
    <select id="inputRung" aria-label="User voice">
      <option value="u1" selected>U1 · Native dictation</option>
      <option value="u2" disabled>U2 · Our own mic UI</option>
      <option value="u3" disabled>U3 · Cleanup pass</option>
      <option value="u4" disabled>U4 · Speech to text (mic permission needed)</option>
    </select>
    <select id="outputRung" aria-label="Humara voice">
      <option value="h1" selected>H1 · Text only</option>
      <option value="h2">H2 · Robot read-back</option>
      <option value="h3" disabled>H3 · Real voice read-back</option>
      <option value="h4" disabled>H4 · Selective speech</option>
    </select>
  </div>
  <div id="chat"></div>
  <div class="composer">
    <input id="input" type="text" placeholder="Message" autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>

<script>
const REPLIES = [
  "I can help with that — are you looking to upgrade your current plan or start a new line of service?",
  "Based on what you've told me, our 500 Mbps plan would be a solid fit. Want me to check availability at your address?",
  "I don't see any outstanding balance on this account — is there something specific you'd like me to look into?",
  "I can get an appointment booked for a technician visit. What day works best for you?",
  "Happy to walk you through the differences between our internet-only and bundle plans."
];

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const outputRung = document.getElementById('outputRung');
let replyIndex = 0;

function addBubble(text, who) {
  const el = document.createElement('div');
  el.className = 'bubble ' + who;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

// --- bench plumbing ---------------------------------------------------

function note(bubble, text) {
  let el = bubble.querySelector('.note');
  if (!el) {
    el = document.createElement('span');
    el.className = 'note';
    bubble.appendChild(el);
  }
  el.textContent = text;
  chat.scrollTop = chat.scrollHeight;
  return el;
}

// every rung reports the same two numbers, so they stay comparable
function report(bubble, rung, ttfa, total) {
  const ms = n => n == null ? '—' : n < 1000 ? Math.round(n) + 'ms' : (n / 1000).toFixed(1) + 's';
  note(bubble, `${rung} · ${ms(ttfa)} to audio · ${ms(total)} total`);
  console.log(`[${rung}] first audio ${ms(ttfa)}, total ${ms(total)}`);
}

// --- output rungs -----------------------------------------------------

function speak(text, bubble) {
  const rung = outputRung.value;
  if (rung === 'h1') return;              // text only — the control condition
  if (rung === 'h2') return robotReadBack(text, bubble);
}

// H2 — Web Speech API, no key, no network
function robotReadBack(text, bubble) {
  if (!('speechSynthesis' in window)) {
    note(bubble, 'H2 · speechSynthesis unavailable in this browser');
    return;
  }

  note(bubble, 'speaking…');
  const t0 = performance.now();
  let ttfa = null;

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.onstart = () => { ttfa = performance.now() - t0; };
  utterance.onend   = () => report(bubble, 'H2', ttfa, performance.now() - t0);
  utterance.onerror = e => note(bubble, `H2 · failed (${e.error || 'unknown'})`);
  speechSynthesis.speak(utterance);
}

// switching rung mid-utterance shouldn't leave the old one talking
outputRung.addEventListener('change', () => {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
});

function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addBubble(text, 'user');

  const reply = REPLIES[replyIndex++ % REPLIES.length];
  const bubble = addBubble(reply, 'bot');
  speak(reply, bubble);
}

document.getElementById('send').addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>

</body>
</html>
